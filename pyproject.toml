[project]
name = "pesterchum"
version = "0.1.0"
description = "Block until a GitHub PR needs attention: new comments, failed required checks, conflicts, queue or merge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pesterchum = "pesterchum.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pesterchum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
